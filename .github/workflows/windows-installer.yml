name: Windows installer

on:
  push:
    branches:
      - arena/e3c7651d-launcher
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows x64 installer
        run: npm run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct download
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish Windows installer:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installerPath = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          gh release create $tag "$installerPath" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Lumen Launcher $version" --notes "Windows x64 installer. Unsigned; SmartScreen may warn." --prerelease
