name: Windows installer

on:
  push:
    branches:
      - arena/e3c7651d-launcher
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $env:DEBUG = 'electron-builder'
          npm run build:win *> build-windows.log
          $buildExitCode = $LASTEXITCODE
          Get-Content build-windows.log
          "Build exit code: $buildExitCode" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($buildExitCode -ne 0) {
            "### Installer build failed" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content build-windows.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            $logText = Get-Content build-windows.log -Raw
            $tail = $logText.Substring([Math]::Max(0, $logText.Length - 7200))
            for ($end = $tail.Length; $end -gt 0; $end -= 900) {
              $start = [Math]::Max(0, $end - 900)
              $chunk = $tail.Substring($start, $end - $start)
              $escapedChunk = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows installer build log::$escapedChunk"
            }
            exit $buildExitCode
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
