name: Windows installer

on:
  push:
    branches:
      - arena/e3c7651d-launcher
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          npm run build:win *> build-windows.log
          $buildExitCode = $LASTEXITCODE
          Get-Content build-windows.log
          if ($buildExitCode -ne 0) {
            "### Installer build failed" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content build-windows.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $buildExitCode
          }

      - name: Report installer build failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-windows.log) {
            Get-Content build-windows.log -Tail 40 | ForEach-Object { Write-Output "::error::$($_)" }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
